<!DOCTYPE html>
<!-- Page: Academic Planner | Part of Sunday Amos Salami's student portfolio -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the layout scale correctly on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Academic Planner | Sunday Amos Salami</title>
  <meta name="description" content="Student portfolio and academic planner of Sunday Amos Salami.">
  <!-- Google Fonts: speeds up font loading, then loads the two font families -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <!-- Site-wide stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ===== Site header and navigation (same on every page) ===== -->
  <header>
    <div class="wrap">
      <a class="brand" href="index.html">Sunday Amos Salami</a>
      <!-- Mobile menu toggle; behaviour is in js/script.js -->
      <button id="menu-btn" aria-label="Toggle menu" aria-expanded="false">Menu</button>
      <nav aria-label="Main">
        <ul id="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="planner.html" class="active" aria-current="page">Planner</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- ===== Main page content ===== -->
  <main>
    <div class="wrap">
      <h1>Academic planner</h1>
      <p class="lead">Add your assignments and study goals, tick them off, and delete what you no longer need. Tasks are saved in your browser.</p>
      <br>

      <!-- Add-task form: task text + optional due date (handled by js/script.js) -->
      <form id="task-form" class="planner-add" aria-label="Add task" style="max-width:none;padding:1rem">
        <input type="text" id="task-input" placeholder="e.g. Finish CSC301 assignment" aria-label="Task" required>
        <input type="date" id="task-date" aria-label="Due date">
        <button class="btn" type="submit">Add task</button>
      </form>

      <!-- Validation error message area -->
      <p class="err" id="task-err"></p>

      <!-- Tasks are inserted here by JavaScript -->
      <ul id="task-list"></ul>

      <!-- Summary, e.g. "2 of 5 tasks completed" -->
      <p class="stats" id="task-stats"></p>
    </div>
  </main>

  <!-- ===== Footer ===== -->
  <footer>
    <p>&copy; 2026 Sunday Amos Salami. Built with HTML, CSS and JavaScript.</p>
  </footer>

  <!-- Shared JavaScript: menu toggle, form validation, planner logic -->
  <script src="js/script.js"></script>
</body>
</html>
